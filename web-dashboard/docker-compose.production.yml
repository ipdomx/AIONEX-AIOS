services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: /ws
      AIOS_BACKEND_ORIGIN: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aionex-network

  backend:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${AIOS_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /var/lib/aionex/backups
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
      - ./secrets:/run/secrets/aionex:ro
      - backup_data:/var/lib/aionex/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - aionex-network

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file:
      - ${AIOS_ENV_FILE:-.env}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aionex-network

  backup-worker:
    image: aionex-aios-backend:local
    restart: unless-stopped
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    command: ["python", "-m", "app.services.backup_worker"]
    env_file:
      - ${AIOS_ENV_FILE:-.env}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    networks:
      - aionex-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --quiet",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - aionex-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - aionex-network

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - aionex-network

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:

networks:
  aionex-network:
    driver: bridge
