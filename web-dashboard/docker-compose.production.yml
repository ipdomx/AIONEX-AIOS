services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_USER_PORTAL_URL: ${AIOS_USER_PORTAL_URL:-https://ai.vip-e.net}
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 256
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: /ws
      AIOS_BACKEND_ORIGIN: http://backend:8000
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  portal:
    build:
      context: ../vip-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.vip-e.net/api/v1
        AIOS_BACKEND_ORIGIN: https://api.vip-e.net
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 256
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.vip-e.net/api/v1
      AIOS_BACKEND_ORIGIN: https://api.vip-e.net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  backend:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.0"
    pids_limit: 768
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /var/lib/aionex/backups
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/RUNPOD_GPU.env
    volumes:
      - ..:/workspace:ro
      - ./secrets:/run/secrets/aionex:ro
      - backup_data:/var/lib/aionex/backups:ro
      - portal_asset_data:/var/lib/aionex/portal-assets:rw
      - project_execution_data:/var/lib/aionex/project-executions:rw
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
      - mobile_release_data:/var/lib/aionex/mobile-releases:ro
    depends_on:
      postgres: {condition: service_healthy}
      postgres-credential-reconciler: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
      - postgres_data:/var/lib/postgresql/data
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  backup-worker:
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    command: ["python", "-m", "app.services.backup_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  communication-worker:
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 384
    command: ["python", "-m", "app.services.communication_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
      - ./secrets:/run/secrets/aionex:ro
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.communication_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  operations-observer:
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["python", "-m", "app.services.operations_observer"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.operations_observer", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  studio-worker:
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    command: ["python", "-m", "app.services.studio_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      STUDIO_ASSET_ROOT: /var/lib/aionex/studio-assets
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.studio_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  three-d-worker:
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    stop_grace_period: 45s
    command: ["python", "-m", "app.services.three_d_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/runpod-gpu.env
    volumes:
      - ..:/workspace:ro
      - ./secrets/RUNPOD_GPU.env:/run/secrets/aionex/runpod-gpu.env:ro
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.three_d_worker", "--healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  project-worker:
    profiles: ["ai-execution"]
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 4g
    cpus: "3.0"
    pids_limit: 768
    command: ["python", "-m", "app.services.project_execution_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      PROJECT_EXECUTION_SECRET_FILE: /run/secrets/aionex/project-openai.env
      PROJECT_EXECUTION_OUTPUT_ROOT: /var/lib/aionex/project-executions
      PROJECT_EXECUTION_LOCAL_REFERENCE: /run/references/phase22b/local-qwen3-8b
      PROJECT_EXECUTION_BUDGET_CAP_USD: "0.05"
      PROJECT_EXECUTION_WEB_SEARCH_COST_USD: "0.01"
      PROJECT_EXECUTION_RESEARCH_MODEL: "gpt-5.4-nano"
    volumes:
      - ..:/workspace:ro
      - ${AIOS_PROJECT_EXECUTION_SECRET_HOST_FILE:-/root/.config/aionex/phase22c-openai.env}:/run/secrets/aionex/project-openai.env:ro
      - ${AIOS_PHASE22B_REFERENCE_HOST_DIR:-/var/tmp/aionex-phase22b/sandbox-output/local-qwen3-8b}:/run/references/phase22b/local-qwen3-8b:ro
      - project_execution_data:/var/lib/aionex/project-executions
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.project_execution_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]


  telegram-worker:
    profiles: ["telegram"]
    image: aionex-aios-backend:local
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 45s
    command: ["python", "-m", "app.services.telegram_worker"]
    env_file: ["${AIOS_ENV_FILE:-.env}"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
    volumes:
      - ..:/workspace:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/secrets/aionex/telegram-bot-token:ro
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.telegram_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 768
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --port 5432 --quiet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "127.0.0.1:${AIOS_ORIGIN_PORT:-8080}:8080"
      - "127.0.0.1:${AIOS_CONTROL_PORT:-8081}:8081"
      - "127.0.0.1:${AIOS_PORTAL_PORT:-8082}:8082"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend: {condition: service_healthy}
      portal: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null && wget -qO- http://127.0.0.1:8081/ >/dev/null && wget -qO- http://127.0.0.1:8082/en/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    profiles: ["tunnel"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    depends_on:
      nginx: {condition: service_healthy}
    security_opt: ["no-new-privileges:true"]
    networks: [aionex-network]

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:
  project_execution_data:
  studio_asset_data:
  mobile_release_data:
  portal_asset_data:

networks:
  aionex-network:
    driver: bridge
    internal: false
