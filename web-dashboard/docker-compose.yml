services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_WS_URL: /ws
      AIOS_BACKEND_ORIGIN: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aionex-network

  backend:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DEBUG: "${DEBUG:-true}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      DATABASE_URL: "${DATABASE_URL:-}"
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-aionex}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-20}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-10}"
      DATABASE_ECHO: "${DATABASE_ECHO:-false}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      REDIS_POOL_SIZE: "${REDIS_POOL_SIZE:-10}"
      SECRET_KEY: "${SECRET_KEY:-change-this-development-secret-key-1234567890}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-30}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:3000"]}'
      AIOS_BOOTSTRAP_OWNER_EMAIL: "${AIOS_BOOTSTRAP_OWNER_EMAIL:-owner@aionex.local}"
      AIOS_BOOTSTRAP_OWNER_PASSWORD: "${AIOS_BOOTSTRAP_OWNER_PASSWORD:-}"
      AIOS_BOOTSTRAP_RESET_OWNER_PASSWORD: "${AIOS_BOOTSTRAP_RESET_OWNER_PASSWORD:-false}"
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    volumes:
      - ..:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aionex-network

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "/app/app/db/postgres_credentials.py"]
    environment:
      DATABASE_URL: "${DATABASE_URL:-}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-aionex}"
      POSTGRES_SOCKET_DIR: /var/run/postgresql
      AIOS_POSTGRES_RECONCILER_DEBUG: "${AIOS_POSTGRES_RECONCILER_DEBUG:-false}"
    volumes:
      - postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aionex-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-aionex}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --quiet",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - aionex-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks:
      - aionex-network

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aionex-network

volumes:
  postgres_data:
  postgres_socket:
  redis_data:

networks:
  aionex-network:
    driver: bridge
