worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;
    send_timeout 30s;

    log_format aionex '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log aionex;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=support_per_ip:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=billing_webhook_per_ip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    map $http_x_forwarded_proto $aionex_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Public API gateway. It deliberately never serves the dashboard frontend.
    server {
        listen 8080 default_server;
        server_name _;

        set $backend_upstream backend:8000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        location = /health {
            proxy_pass http://$backend_upstream/health;
            access_log off;
        }

        location = /ready {
            proxy_pass http://$backend_upstream/ready;
            access_log off;
        }

        location ~ ^/(docs|redoc|openapi\.json|\.git|\.env|server-status) {
            return 404;
        }

        location ~ ^/api/v1/auth/(login|refresh|register/free|password-reset(?:/confirm)?|mfa/challenge|firebase/social/session|passkeys/authentication/) {
            limit_req zone=auth_per_ip burst=8 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
        }

        location ~ ^/api/v1/billing/webhooks/(stripe|paypal|paddle|paymob|fawry|stc_pay)$ {
            limit_req zone=billing_webhook_per_ip burst=60 nodelay;
            client_max_body_size 2m;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_hide_header Server;
        }

        location ~ ^/api/v1/billing/(catalog/public|providers/public)$ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_hide_header Server;
        }

        location = /api/v1/support/requests {
            limit_req zone=support_per_ip burst=2 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_hide_header Server;
        }

        # Short-lived, HMAC-authenticated open-song artifact bridge. The larger
        # body allowance is isolated to 48 kHz stereo WAV ingress only.
        location ~ "^/api/v1/audio-song-artifacts/[0-9a-f]{48}$" {
            limit_req zone=api_per_ip burst=30 nodelay;
            limit_conn connections_per_ip 8;
            client_max_body_size 48m;
            proxy_request_buffering off;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_hide_header Server;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Only contracts used by the public user portal reach the application.
        # Privileged and unlisted API paths are indistinguishable from missing routes.
        location ~ "^/api/v1/(?:auth/(?:logout|me|free-tier(?:/public)?|mfa(?:/.*)?|firebase/phone/(?:public|readiness)|firebase/social/(?:public|registration/prepare)|passkeys(?:/.*)?)|settings(?:/(?:password|sessions(?:/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})?))?|billing(?:/(?:invoices|transactions|usage|wallet|payment-methods(?:/[0-9a-f-]{36}(?:/default)?)?|checkout|portal-session|subscription/cancel|coupons/validate))?|notifications(?:/.*)?|communications/(?:channels|endpoints(?:/[0-9a-f-]{36})?|preferences|deliveries)|telegram/(?:status|link-challenge|link)|growth-social/access|growth-social/campaigns(?:/.*)?|growth-social/accounts(?:/.*)?|growth-social/providers(?:/.*)?|growth-social/content(?:/.*)?|growth-social/analytics(?:/.*)?|growth-social/leads(?:/.*)?|growth-social/inbox(?:/.*)?|growth-social/paid-campaigns(?:/.*)?|growth-social/provider-connectors(?:/.*)?|growth-social/integrations(?:/.*)?|growth-social/team-assignments(?:/.*)?|growth-social/reports(?:/.*)?|growth-social/report-runs(?:/.*)?|support/requests(?:/.*)?|workspaces(?:/.*)?|projects(?:/.*)?|security-lab(?:/.*)?|portal/(?:published|assets/[0-9a-f]{32}))$" {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn connections_per_ip 20;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_hide_header Server;
        }

        location /api/ {
            return 404;
        }

        location /ws/ {
            limit_conn connections_per_ip 8;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel public;
            proxy_read_timeout 60s;
        }

        location / {
            return 404;
        }
    }

    # Public user portal origin. Publish only through ai.vip-e.net. The portal
    # calls the separately allowlisted public API hostname and never receives
    # private control-plane routes.
    server {
        listen 8082;
        server_name _;

        set $portal_upstream portal:3000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), publickey-credentials-create=(self), publickey-credentials-get=(self), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

        location ~ ^/(docs|redoc|openapi\.json|\.git|\.env|server-status) {
            return 404;
        }

        # API traffic must use api.vip-e.net so the public API allowlist,
        # rate limits, and X-AIOS-Auth-Channel boundary remain authoritative.
        location /api/ {
            return 404;
        }

        location /ws/ {
            return 404;
        }

        location / {
            limit_conn connections_per_ip 40;
            proxy_pass http://$portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
        }
    }

    # Private control plane. Publish this listener only through a separate
    # Cloudflare Access-protected hostname; never map the public API hostname.
    server {
        listen 8081;
        server_name _;

        set $frontend_upstream frontend:3000;
        set $backend_upstream backend:8000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        location ~ ^/(docs|redoc|openapi\.json|\.git|\.env|server-status) {
            return 404;
        }

        # Registration exists only on the public VIP gateway. The private
        # control plane accepts existing Super Owner sessions only.
        location ~ ^/api/v1/auth/register(?:/|$) {
            return 404;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn connections_per_ip 20;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel private;
            proxy_hide_header Server;
        }

        location /ws/ {
            limit_conn connections_per_ip 8;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-AIOS-Auth-Channel private;
            proxy_read_timeout 60s;
        }

        location / {
            limit_conn connections_per_ip 40;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
