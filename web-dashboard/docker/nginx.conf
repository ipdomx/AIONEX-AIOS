events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker assigns a new IP whenever an application container is recreated.
    # Resolve service names through Docker's embedded DNS at request time so
    # Nginx never keeps a dead frontend or backend address after a deployment.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    map $http_x_forwarded_proto $aionex_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 80;
        server_name _;

        set $frontend_upstream frontend:3000;
        set $backend_upstream backend:8000;

        # Frontend
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # API
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
