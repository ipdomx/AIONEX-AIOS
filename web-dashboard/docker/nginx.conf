user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 25m;
    client_body_timeout 20s;
    client_header_timeout 20s;
    keepalive_timeout 30s;
    send_timeout 30s;

    log_format aionex '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
    access_log /var/log/nginx/access.log aionex;
    error_log /var/log/nginx/error.log warn;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;

    map $http_x_forwarded_proto $aionex_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;
        server_name _;

        set $frontend_upstream frontend:3000;
        set $backend_upstream backend:8000;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        location = /health {
            proxy_pass http://$backend_upstream/health;
            access_log off;
        }

        location ~ ^/(docs|redoc|openapi\.json|\.git|\.env|server-status) {
            return 404;
        }

        location / {
            limit_conn connections_per_ip 40;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
        }

        location ~ ^/api/v1/auth/(login|register|free/register|refresh) {
            limit_req zone=auth_per_ip burst=8 nodelay;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_conn connections_per_ip 20;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
        }

        location /ws/ {
            limit_conn connections_per_ip 8;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $aionex_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 60s;
        }
    }
}
