  design-image-worker: {restart: "no"}
  identity-media-worker: {restart: "no"}
  media-worker: {restart: "no"}
  operations-observer: {restart: "no"}
  postgres: {restart: "no"}
  postgres-credential-reconciler: {restart: "no"}
  project-worker: {restart: "no"}
  security-remediation-worker: {restart: "no"}
