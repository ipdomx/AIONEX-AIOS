name: AIONEXAIOS
options:
  bundleIdPrefix: net.vipe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
targets:
  AIONEXAIOS:
    type: application
    platform: iOS
    sources:
      - path: AIONEXAIOS
        excludes:
          - Resources
    resources:
      - path: AIONEXAIOS/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.vipe.aionex
        PRODUCT_NAME: AIONEX AIOS
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: AIONEX AIOS
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AIONEXAIOS/AIONEXAIOS.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:ai.vip-e.net
schemes:
  AIONEXAIOS:
    build:
      targets:
        AIONEXAIOS: all
    run:
      config: Debug
    archive:
      config: Release
