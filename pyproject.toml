[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-enterprise"
version = "2.2.0b3"
description = "AIOS Enterprise Engineering Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aios = "aios.cli:main"
aios-api = "aios.api:main"
aios-telegram = "aios.telegram:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
