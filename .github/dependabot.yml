version: 2
updates:
  - package-ecosystem: pip
    directory: "/web-dashboard/backend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    # The security acceptance lab intentionally carries vulnerable pins so the
    # scanner can prove it detects known-bad inputs. Version updates for those
    # test-only manifests would erase the negative-control fixture.
    exclude-paths:
      - "tests/security_acceptance_lab/fixtures/vulnerable/**"
    groups:
      python-runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web-dashboard/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      frontend-runtime:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
