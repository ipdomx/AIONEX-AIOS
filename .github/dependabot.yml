version: 2
updates:
  - package-ecosystem: pip
    directory: "/web-dashboard/backend"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/web-dashboard/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      frontend-runtime:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: ["dependencies", "security"]
    groups:
      actions:
        patterns: ["*"]
