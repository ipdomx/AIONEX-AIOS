name: Run Identity Hardening

on:
  push:
    branches:
      - feat/free-user-onboarding-quotas

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/free-user-onboarding-quotas
          fetch-depth: 0
      - name: Extract and apply identity patch
        run: |
          awk '/^LS0t/{capture=1} /^PATCH$/{capture=0} capture' .github/workflows/apply-identity-hardening.yml > /tmp/identity.patch.b64
          test -s /tmp/identity.patch.b64
          base64 -d /tmp/identity.patch.b64 > /tmp/identity.patch
          patch -p1 < /tmp/identity.patch
          rm -f .github/workflows/apply-identity-hardening.yml
          rm -f .github/workflows/run-identity-hardening.yml
          rm -f .github/workflows/one-shot-implementation-snapshot.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce verified free-user identity and device checks"
          git push origin HEAD:feat/free-user-onboarding-quotas
