name: P2 temporary pin resolver
on:
  push:
    branches: [feat/p2-hunyuan-hardening-blender-20261107]
    paths: [".github/workflows/p2-resolve-temp.yml"]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve torch 2.10 bases and locks
        run: |
          curl -fsSL "https://hub.docker.com/v2/repositories/pytorch/pytorch/tags?page_size=100&name=2.10" | python3 -c "import json,sys; print('TAGS', sorted(r['name'] for r in json.load(sys.stdin)['results']))"
          for t in 2.10.0-cuda12.8-cudnn9-runtime 2.10.0-cuda12.8-cudnn9-devel; do echo "DIGEST $t $(docker buildx imagetools inspect pytorch/pytorch:$t --format '{{json .Manifest.Digest}}')"; done
          docker run --rm --entrypoint python pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime -c "import sys; print('PY', sys.version)"
          docker run --rm --entrypoint python pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime -m pip list --format=freeze > base.txt; sed 's/^/BASE /' base.txt
          docker run --rm --entrypoint cat pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime /etc/os-release | head -2
          python3 -m pip install -q uv
          grep -i -E '^(torch|torchvision|torchaudio|triton|setuptools|filelock|sympy|networkx|jinja2|markupsafe|mpmath|typing.extensions)==' base.txt > c.txt; cat c.txt
          PYV=$(docker run --rm --entrypoint python pytorch/pytorch:2.10.0-cuda12.8-cudnn9-runtime -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')")
          uv pip compile infra/runpod/hunyuan3d/requirements.in -c c.txt --python-version $PYV --python-platform x86_64-manylinux_2_35 --generate-hashes --no-header --no-annotate --no-emit-package torch --no-emit-package torchvision --no-emit-package triton --no-emit-package setuptools -o h.txt
          echo "===== HLOCK BEGIN"; grep -v -E "^\s*# via" h.txt; echo "===== HLOCK END"
          printf 'pybind11\n' > b.in; uv pip compile b.in --python-version $PYV --python-platform x86_64-manylinux_2_35 --generate-hashes --no-header --no-annotate -o b.txt; echo "===== BLOCK BEGIN"; cat b.txt; echo "===== BLOCK END"
          cp infra/runpod/triposr/requirements.txt t.in; echo "safetensors==0.8.0" >> /dev/null
          uv pip compile t.in -c c.txt --python-version $PYV --python-platform x86_64-manylinux_2_28 --generate-hashes --no-header --no-annotate --no-emit-package torch --no-emit-package torchvision --no-emit-package triton --no-emit-package setuptools -o t.txt
          echo "===== TLOCK BEGIN"; cat t.txt; echo "===== TLOCK END"
