name: P2 temporary pin resolver
on:
  push:
    branches: [feat/p2-hunyuan-hardening-blender-20261107]
    paths: [".github/workflows/p2-resolve-temp.yml", "infra/blender-converter/**"]
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build converter
        run: docker build --progress=plain -t conv:test infra/blender-converter 2>&1 | tail -150
      - name: Trivy converter
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.72.0 image --quiet --scanners vuln --severity HIGH,CRITICAL --format table conv:test || true
  hunyuan-info:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Source details
        run: |
          git clone -q https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1 /tmp/hy && cd /tmp/hy && git checkout -q 82920d643c0dc2f7bfd7255f45f62d386edfe60c
          echo "===== IMPORTS"
          git ls-files 'hy3dshape/hy3dshape/*.py' 'hy3dpaint/*.py' | grep -v -E '/(src|train)|train\.py|hy3dpaint/hunyuanpaintpbr/model\.py' | xargs grep -h -E '^\s*(import|from) ' | sed 's/^\s*//' | sort | uniq -c | sort -rn
          for f in hy3dshape/hy3dshape/__init__.py hy3dshape/hy3dshape/utils/utils.py hy3dshape/hy3dshape/utils/__init__.py hy3dpaint/utils/simplify_mesh_utils.py hy3dpaint/utils/uvwrap_utils.py hy3dpaint/hunyuanpaintpbr/__init__.py hy3dpaint/custom_rasterizer/setup.py hy3dpaint/DifferentiableRenderer/MeshRender.py hy3dpaint/convert_utils.py hy3dpaint/torchvision_fix.py; do echo "===== FILE $f"; head -c 9000 "$f"; echo; done
          echo "===== modules tail"; sed -n 790,840p hy3dpaint/hunyuanpaintpbr/unet/modules.py
          echo "===== pipeline_utils imports"; grep -n -E 'import|inpaint|cv2' hy3dpaint/utils/pipeline_utils.py | head -40
          git ls-files hy3dpaint/custom_rasterizer hy3dpaint/DifferentiableRenderer hy3dshape/hy3dshape | head -200
      - name: Hunyuan lock
        run: |
          python3 -m pip install -q uv
          mkdir -p /tmp/lock && cd /tmp/lock
          cat > hunyuan.in <<'R'
          diffusers
          transformers<5
          accelerate
          safetensors
          huggingface-hub<1
          omegaconf
          einops
          trimesh
          pymeshlab
          pygltflib
          xatlas
          opencv-python-headless
          numpy<2.4
          scipy
          scikit-image
          pillow
          pyyaml
          tqdm
          runpod
          pybind11
          timm
          R
          printf 'torch==2.9.1\ntorchvision==0.24.1\ntriton==3.5.1\nsetuptools==79.0.1\n' > c.txt
          uv pip compile hunyuan.in -c c.txt --python-version 3.11 --python-platform x86_64-manylinux_2_28 --no-header --no-annotate --no-emit-package torch --no-emit-package torchvision --no-emit-package triton --no-emit-package setuptools -o plain.txt; cat plain.txt | grep -v nvidia
