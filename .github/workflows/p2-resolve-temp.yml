name: P2 temporary pin resolver
on:
  push:
    branches: [feat/p2-hunyuan-hardening-blender-20261107]
    paths: [".github/workflows/p2-resolve-temp.yml", "infra/blender-converter/**"]
permissions:
  contents: read
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build converter
        run: docker build --progress=plain -t conv:test infra/blender-converter 2>&1 | tail -150
      - name: Trivy converter
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.72.0 image --quiet --scanners vuln --severity HIGH,CRITICAL --format table conv:test || true
  hunyuan-info:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lock, patch and import trace
        run: |
          set -x
          python3 -m pip install -q uv
          W=$PWD
          mkdir -p /tmp/lock && cd /tmp/lock
          printf 'torch==2.9.1\ntorchvision==0.24.1\ntriton==3.5.1\nsetuptools==79.0.1\n' > c.txt
          uv pip compile $W/infra/runpod/hunyuan3d/requirements.in -c c.txt --python-version 3.11 --python-platform x86_64-manylinux_2_35 --generate-hashes --no-header --no-emit-package torch --no-emit-package torchvision --no-emit-package triton --no-emit-package setuptools -o lock.txt
          grep -v -E "^nvidia" lock.txt > /dev/null; python3 - <<'PY'
          import re
          text = open("/tmp/lock/lock.txt").read()
          blocks = re.split(r"\n(?=[a-z0-9])", text)
          keep = [b for b in blocks if not b.startswith(("nvidia-", "#"))]
          open("/tmp/lock/lock.clean.txt", "w").write("\n".join(keep).strip() + "\n")
          PY
          echo "===== HLOCK BEGIN"; cat lock.clean.txt; echo "===== HLOCK END"
          printf 'pybind11\n' > b.in; uv pip compile b.in --python-version 3.11 --python-platform x86_64-manylinux_2_35 --generate-hashes --no-header -o b.txt; echo "===== BLOCK BEGIN"; cat b.txt; echo "===== BLOCK END"
          git clone -q https://github.com/Tencent-Hunyuan/Hunyuan3D-2.1 /tmp/hy && cd /tmp/hy && git checkout -q 82920d643c0dc2f7bfd7255f45f62d386edfe60c
          sha256sum hy3dpaint/hunyuanpaintpbr/unet/modules.py hy3dpaint/hunyuanpaintpbr/unet/attn_processor.py hy3dpaint/textureGenPipeline.py hy3dpaint/utils/multiview_utils.py
          python3 $W/infra/runpod/hunyuan3d/patch_hunyuan_runtime.py /tmp/hy || true
          git diff --stat; git status --short | head -50
          uv venv -q --python 3.11 /tmp/v
          uv pip install -q --python /tmp/v/bin/python --index-url https://download.pytorch.org/whl/cpu torch==2.9.1 torchvision==0.24.1
          uv pip install -q --python /tmp/v/bin/python --require-hashes --no-deps -r /tmp/lock/lock.clean.txt 2>&1 | tail -5
          cat > /tmp/trace.py <<'PY'
          import sys, types, traceback
          sys.path[:0] = ["/tmp/hy", "/tmp/hy/hy3dshape", "/tmp/hy/hy3dpaint"]
          sys.modules["bpy"] = types.ModuleType("bpy")
          stubbed = []
          for _ in range(40):
              try:
                  for name in list(sys.modules):
                      if name.startswith(("hy3dshape", "textureGenPipeline", "hunyuanpaintpbr", "utils", "DifferentiableRenderer")):
                          del sys.modules[name]
                  import hy3dshape
                  from hy3dshape import Hunyuan3DDiTFlowMatchingPipeline
                  from textureGenPipeline import Hunyuan3DPaintConfig, Hunyuan3DPaintPipeline
                  from hunyuanpaintpbr.pipeline import HunyuanPaintPipeline
                  from hunyuanpaintpbr.unet.modules import UNet2p5DConditionModel, Dino_v2
                  from utils.image_super_utils import imageSuperNet
                  break
              except ModuleNotFoundError as exc:
                  frame = [f for f in traceback.extract_tb(exc.__traceback__) if "/tmp/hy" in f.filename][-1:]
                  print("MISSING", exc.name, frame)
                  stubbed.append(exc.name)
                  sys.modules[exc.name] = types.ModuleType(exc.name)
              except Exception as exc:
                  traceback.print_exc(); break
          print("STUBBED", stubbed)
          print("LOADED", sorted({m.split(".")[0] for m in sys.modules if not m.startswith("_")}))
          PY
          /tmp/v/bin/python /tmp/trace.py 2>&1 | tail -80
