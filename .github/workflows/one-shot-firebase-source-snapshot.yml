name: One-shot Firebase Source Snapshot

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Package repository source
        run: |
          mkdir -p /tmp/aionex-source
          rsync -a --exclude=.git --exclude=node_modules --exclude=.next ./ /tmp/aionex-source/
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: aionex-firebase-source
          path: /tmp/aionex-source
          if-no-files-found: error
          retention-days: 1
