name: Fix Firebase Phone Activation Diagnostics and Country Code

on:
  push:
    branches:
      - fix/firebase-phone-activation-country

permissions:
  contents: write

concurrency:
  group: fix-firebase-phone-activation-country
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply and verify registration fixes
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/firebase-phone-activation-country
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/firebase-phone-activation-country
          fetch-depth: 0

      - name: Apply reviewed source changes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          auth_gate = Path("web-dashboard/frontend/src/components/auth/AuthGate.tsx")
          text = auth_gate.read_text(encoding="utf-8")
          old = '''function inferredCountryCode(): string {
            if (typeof navigator === "undefined") return "";
            const locale = navigator.language.replace("_", "-");
            const segments = locale.split("-");
            const region = segments.find((segment) => /^[A-Za-z]{2}$/.test(segment));
            return region?.toUpperCase() ?? "";
          }
          '''
          new = '''function inferredCountryCode(): string {
            if (typeof navigator === "undefined") return "";

            const locales = Array.from(
              new Set([...(navigator.languages ?? []), navigator.language].filter(Boolean)),
            );
            for (const locale of locales) {
              const normalized = locale.replace("_", "-");
              try {
                const region = new Intl.Locale(normalized).region;
                if (region && /^[A-Za-z]{2}$/.test(region)) {
                  return region.toUpperCase();
                }
              } catch {
                const fallbackRegion = normalized
                  .split("-")
                  .slice(1)
                  .find((segment) => /^[A-Za-z]{2}$/.test(segment));
                if (fallbackRegion) return fallbackRegion.toUpperCase();
              }
            }
            return "";
          }
          '''
          if old not in text:
              raise SystemExit("AuthGate country inference block did not match")
          auth_gate.write_text(text.replace(old, new, 1), encoding="utf-8")

          firebase_auth = Path(
              "web-dashboard/frontend/src/lib/firebase-phone-auth.ts"
          )
          text = firebase_auth.read_text(encoding="utf-8")
          replacements = {
              '''    "auth/captcha-check-failed": "The security check failed. Please try again.",''':
              '''    "auth/captcha-check-failed":
              "The security check failed. Confirm this site is listed under Firebase Authentication > Settings > Authorized domains, then try again.",''',
              '''    "auth/operation-not-allowed":
              "Phone verification is not enabled for this project.",''':
              '''    "auth/operation-not-allowed":
              "Firebase rejected SMS for this project. Enable the Phone provider, allow this phone region under Authentication > Settings > SMS region policy, and link an active Cloud Billing account.",''',
              '''    "auth/unauthorized-domain":
              "This site domain is not authorized in Firebase.",''':
              '''    "auth/unauthorized-domain":
              "Add this site hostname or IP under Firebase Authentication > Settings > Authorized domains.",''',
          }
          for original, replacement in replacements.items():
              if original not in text:
                  raise SystemExit(f"Firebase error mapping did not match: {original!r}")
              text = text.replace(original, replacement, 1)
          firebase_auth.write_text(text, encoding="utf-8")

          contract_test = Path(
              "web-dashboard/backend/tests/test_frontend_registration_runtime_contracts.py"
          )
          contract_test.write_text(
              '''from pathlib import Path


REPOSITORY_ROOT = Path(__file__).resolve().parents[3]
AUTH_GATE = REPOSITORY_ROOT / "frontend/src/components/auth/AuthGate.tsx"
FIREBASE_PHONE_AUTH = REPOSITORY_ROOT / "frontend/src/lib/firebase-phone-auth.ts"


def test_country_inference_uses_locale_region_not_language_code():
    source = AUTH_GATE.read_text(encoding="utf-8")
    assert "new Intl.Locale(normalized).region" in source
    assert "split(\"-\").slice(1)" in source
    assert "segments.find" not in source


def test_firebase_phone_error_is_actionable_for_cloud_activation():
    source = FIREBASE_PHONE_AUTH.read_text(encoding="utf-8")
    assert "SMS region policy" in source
    assert "Cloud Billing account" in source
    assert "Authorized domains" in source
    assert "Phone verification is not enabled for this project." not in source
''',
              encoding="utf-8",
          )
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run registration source-contract tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1
          python -m pytest -vv \
            web-dashboard/backend/tests/test_frontend_registration_runtime_contracts.py \
            --maxfail=1 --tb=long --showlocals

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json

      - name: Install and verify frontend
        working-directory: web-dashboard/frontend
        run: |
          npm ci
          npx prettier --write \
            src/components/auth/AuthGate.tsx \
            src/lib/firebase-phone-auth.ts
          npx prettier --check \
            src/components/auth/AuthGate.tsx \
            src/lib/firebase-phone-auth.ts
          npm run lint -- \
            --file src/components/auth/AuthGate.tsx \
            --file src/lib/firebase-phone-auth.ts
          npm run type-check
          npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f .github/workflows/fix-firebase-phone-activation-country.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Fix Firebase SMS activation guidance and country inference"
          git push origin "HEAD:${TARGET_BRANCH}"
