name: Native App

# The Flutter app in app/ (Android, iOS and the signed-in web workspace).
on:
  pull_request:
    paths:
      - "app/**"
      - "vip-frontend/src/messages/**"
      - ".github/workflows/native-app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "vip-frontend/src/messages/**"
      - ".github/workflows/native-app.yml"
  workflow_dispatch:
  schedule:
    # Daily: warn early if Cloudflare moves api.vip-e.net to a CA the app does not pin.
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messages:
    name: App translations match the website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check app/lib/l10n against vip-frontend/src/messages
        run: python3 app/tool/sync_messages.py --check

  pinned-roots:
    name: Live API certificate chains to a pinned root
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify api.vip-e.net against app/assets/security/api_roots.crt only
        run: |
          set -o pipefail
          echo | openssl s_client -connect api.vip-e.net:443 -servername api.vip-e.net \
            -CAfile app/assets/security/api_roots.crt -no-CApath -no-CAstore -verify_return_error 2>&1 \
            | grep -E "Verify return code: 0 \(ok\)"

  flutter:
    name: Analyze, test and build (Android + web)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Flutter 3.44.0 / Dart 3.12.0, pinned by digest (same image the server uses).
    container:
      image: ghcr.io/cirruslabs/flutter@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Platform folders and lockfile are committed
        run: |
          for path in android ios web pubspec.lock; do
            test -e "$path" || { echo "app/$path is missing" >&2; exit 1; }
          done
      - name: Install packages
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Pinning works against the real API (no account needed)
        env:
          AIONEX_LIVE_NETWORK: "1"
        run: flutter test test/live/ --plain-name "certificate pinning"
      - name: Build web
        run: flutter build web --release --no-web-resources-cdn
      - name: Build Android (release, R8 + Dart obfuscation; debug-signed until N-11)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/android
