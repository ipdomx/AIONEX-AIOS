name: Native App

# The Flutter app in app/ (Android, iOS and the signed-in web workspace).
on:
  pull_request:
    paths:
      - "app/**"
      - "vip-frontend/src/messages/**"
      - ".github/workflows/native-app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "vip-frontend/src/messages/**"
      - ".github/workflows/native-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messages:
    name: App translations match the website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check app/lib/l10n against vip-frontend/src/messages
        run: python3 app/tool/sync_messages.py --check

  flutter:
    name: Analyze, test and build (Android + web)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 40
    # Flutter 3.44.0 / Dart 3.12.0, pinned by digest (same image the server uses).
    container:
      image: ghcr.io/cirruslabs/flutter@sha256:46691e311715845de03a3ba4753a475476936805b29431b1f00f1816981033f8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Bootstrap platform folders and lockfile (one-off, removed in the next commit)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          flutter create --org net.vipe --project-name aionex --platforms android,ios,web .
          rm -f test/widget_test.dart
          flutter pub get
          cd "$GITHUB_WORKSPACE"
          git config user.name "aionex-ci"
          git config user.email "ci@vip-e.net"
          git add app/android app/ios app/web
          git add -f app/pubspec.lock
          git status --short --ignored app/android app/ios app/web | head -50
          git commit -qm "chore(app): generated platform folders and pubspec.lock (flutter create 3.44.0)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
