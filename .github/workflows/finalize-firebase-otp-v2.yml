name: Firebase OTP Integration Builder

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: firebase-otp-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BRANCH: ${{ github.head_ref }}
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-firebase-integration-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aionex_test
      REDIS_URL: redis://localhost:6379/0
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-dashboard/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Apply, test, and commit Firebase OTP integration
        run: bash .github/scripts/finalize-firebase-otp.sh
