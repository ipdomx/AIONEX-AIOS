name: Firebase OTP Integration Builder

on:
  push:
    branches: [feat/firebase-phone-otp-complete]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: firebase-otp-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-firebase-integration-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aionex_test
      REDIS_URL: redis://localhost:6379/0
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-dashboard/backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Restrict secret scan to committed credential material
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/finalize-firebase-otp.sh")
          text = path.read_text()
          start = text.index("test -f web-dashboard/secrets/.gitignore")
          end = text.index("\nrm -f .github/workflows/one-shot-firebase-source-snapshot.yml", start)
          replacement = r'''test -f web-dashboard/secrets/.gitignore
test "$(find web-dashboard/secrets -mindepth 1 -maxdepth 1 -type f ! -name .gitignore | wc -l)" = "0"
test -z "$(git ls-files 'web-dashboard/secrets/*' | grep -v '^web-dashboard/secrets/.gitignore$' || true)"
if git grep -I -n 'BEGIN PRIVATE KEY' -- \
  ':!web-dashboard/backend/tests/*' \
  ':!.github/scripts/finalize-firebase-otp.sh' \
  ':!.github/workflows/finalize-firebase-otp-integration.yml' \
  ':!.github/workflows/finalize-firebase-otp-v2.yml'
then
  exit 1
fi
if git grep -I -n -E '"private_key"[[:space:]]*:[[:space:]]*"-----BEGIN' -- \
  ':!web-dashboard/backend/tests/*'
then
  exit 1
fi
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Apply, test, and commit Firebase OTP integration
        run: bash .github/scripts/finalize-firebase-otp.sh
