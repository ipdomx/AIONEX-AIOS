name: Apply Identity Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply verified identity patch
        run: |
          cat > /tmp/identity.patch.b64 <<'PATCH'

PATCH
          base64 -d /tmp/identity.patch.b64 > /tmp/identity.patch
          patch -p1 < /tmp/identity.patch
          rm -f .github/workflows/apply-identity-hardening.yml
          rm -f .github/workflows/one-shot-implementation-snapshot.yml
      - name: Commit identity hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Enforce verified free-user identity and device checks"
          git push origin "HEAD:${HEAD_BRANCH}"
