name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  apply-pr149-repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Apply PR149 repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply deterministic source repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/patch_pr149_backend.py
          python .github/scripts/patch_pr149_frontend.py
          python .github/scripts/patch_pr149_contract.py

          python -m py_compile \
            web-dashboard/backend/app/services/free_tier.py \
            web-dashboard/backend/app/api/v1/endpoints/auth.py \
            web-dashboard/backend/app/api/owner/free_tier.py

          grep -q 'def verify_phone_verification_token' web-dashboard/backend/app/services/free_tier.py
          grep -q 'def _age_on' web-dashboard/backend/app/services/free_tier.py
          grep -q 'def _assert_real_device_signals' web-dashboard/backend/app/services/free_tier.py
          grep -q 'phone_verification_token' web-dashboard/frontend/src/lib/auth-service.ts
          grep -q 'birth_date' web-dashboard/frontend/src/lib/auth-service.ts
          grep -q 'phone_number' web-dashboard/frontend/src/components/auth/AuthGate.tsx
          test -f web-dashboard/frontend/src/lib/owner-free-tier.ts

          rm -rf .github/identity-patch
          rm -f .github/identity.patch.b64
          rm -f .github/workflows/apply-identity-hardening.yml
          rm -f .github/workflows/run-identity-hardening.yml
          rm -f .github/workflows/one-shot-implementation-snapshot.yml
          rm -rf .github/scripts
          git checkout origin/main -- .github/workflows/codeql.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Fix verified free-user identity registration"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
