name: Prettier Capture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Generate canonical Prettier output
        run: |
          npx prettier --write src/app/owner/operations/page.tsx
          mkdir -p prettier-capture/src/app/owner/operations
          cp src/app/owner/operations/page.tsx prettier-capture/src/app/owner/operations/page.tsx
          git diff -- src/app/owner/operations/page.tsx > prettier-capture/prettier.patch
      - name: Upload canonical Prettier output
        uses: actions/upload-artifact@v4
        with:
          name: owner-operations-prettier-capture
          path: web-dashboard/frontend/prettier-capture
          if-no-files-found: error
          retention-days: 1
