name: Prettier Canonical Commit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    defaults:
      run:
        working-directory: web-dashboard/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Apply canonical Prettier output
        run: npx prettier --write src/app/owner/operations/page.tsx
      - name: Commit canonical formatting
        run: |
          git diff --check
          if git diff --quiet -- src/app/owner/operations/page.tsx; then
            echo "Owner Operations page is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/owner/operations/page.tsx
          git commit -m "Apply canonical Prettier output to Owner Operations"
          git push origin "HEAD:${HEAD_BRANCH}"
