name: Final Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-tests:
    name: Core Owner / Release / Web Contracts
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run core tests
        run: |
          python -m pytest -q \
            tests/test_release_governance.py \
            tests/test_web_dashboard_integration.py \
            tests/test_web_integration.py \
            tests/test_production_hardening.py

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aionex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-validation-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aionex_test
      REDIS_URL: redis://localhost:6379/0
      BACKUP_DIR: /tmp/aionex-ci-backups
      RUN_LIVE_BACKUP_SMOKE: "1"
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-dashboard/backend/requirements.txt
      - name: Install backend dependencies
        working-directory: web-dashboard/backend
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run database migrations
        working-directory: web-dashboard/backend
        run: alembic upgrade head
      - name: Run backend verification
        working-directory: web-dashboard/backend
        run: |
          chmod +x scripts/verify_backend.sh
          ./scripts/verify_backend.sh
      - name: Run backend tests with coverage
        working-directory: web-dashboard/backend
        run: |
          set -o pipefail
          mkdir -p diagnostics/backend
          python -m pytest -vv tests \
            --maxfail=1 \
            --tb=long \
            --showlocals \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=22 2>&1 | tee diagnostics/backend/pytest-full.log
      - name: Collect backend diagnostics
        if: always()
        working-directory: web-dashboard/backend
        run: |
          mkdir -p diagnostics/backend
          PGPASSWORD=postgres psql \
            --host localhost \
            --username postgres \
            --dbname aionex_test \
            --no-password \
            --command 'SELECT version(), current_user, current_database();' \
            > diagnostics/backend/postgres-readiness.log 2>&1 || true
          env | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY)=.*/\1=[REDACTED]/I' \
            > diagnostics/backend/environment-redacted.log
      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-diagnostics
          path: web-dashboard/backend/diagnostics/backend
          if-no-files-found: warn
          retention-days: 7

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Owner Arabic coverage
        run: npm run check:owner-arabic
      - name: Check TypeScript
        run: npm run type-check
      - name: Lint Owner dashboard
        run: |
          lint_args=(
            --dir src/app/owner
            --file src/app/settings/page.tsx
            --file src/components/auth/SuperOwnerGuard.tsx
            --file src/components/layout/CommandPalette.tsx
            --file src/components/layout/Sidebar.tsx
            --file src/components/search/GlobalSearch.tsx
            --file src/hooks/use-owner-resource.ts
            --file src/lib/account-settings.ts
          )
          for owner_lib in src/lib/owner-*.ts; do
            lint_args+=(--file "$owner_lib")
          done
          npm run lint -- "${lint_args[@]}"
      - name: Check frontend formatting
        run: |
          npx prettier --check \
            src/app/owner \
            src/app/settings/page.tsx \
            src/components/auth/SuperOwnerGuard.tsx \
            src/components/layout/CommandPalette.tsx \
            src/components/layout/Sidebar.tsx \
            src/components/search/GlobalSearch.tsx \
            src/hooks/use-owner-resource.ts \
            src/lib/account-settings.ts \
            src/lib/owner-*.ts
      - name: Build production frontend
        run: npm run build

  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare production Compose environment
        working-directory: web-dashboard
        run: cp .env.production.example .env.production
      - name: Validate Compose configurations
        working-directory: web-dashboard
        run: |
          docker compose -f docker-compose.yml config --quiet
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
          docker compose \
            --env-file .env.production \
            -f docker-compose.production.yml \
            config --quiet
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/deploy/production/.env.production.example" \
          docker compose \
            --env-file "$GITHUB_WORKSPACE/deploy/production/.env.production.example" \
            -f ../deploy/production/docker-compose.production.yml \
            config --quiet
      - name: Build production images
        working-directory: web-dashboard
        run: |
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
          docker compose \
            --env-file .env.production \
            -f docker-compose.production.yml \
            build backend frontend
      - name: Verify legacy DATABASE_URL upgrade preserves PostgreSQL data
        working-directory: web-dashboard
        run: |
          set -Eeuo pipefail
          mkdir -p diagnostics/docker
          cp .env.production.example .env.legacy
          sed -i \
            -e 's/^POSTGRES_USER=.*/POSTGRES_USER=legacy_user/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=legacy-password/' \
            -e 's/^POSTGRES_DB=.*/POSTGRES_DB=legacy_database/' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=|' \
            .env.legacy
          compose_args=(
            docker compose
            --project-name aionex-legacy-compat
            --env-file .env.legacy
            -f docker-compose.production.yml
          )
          collect_diagnostics() {
            set +e
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
              "${compose_args[@]}" ps --all > diagnostics/docker/compose-ps.log 2>&1
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
              "${compose_args[@]}" logs --no-color postgres-credential-reconciler \
              > diagnostics/docker/reconciler.log 2>&1
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
              "${compose_args[@]}" logs --no-color postgres \
              > diagnostics/docker/postgres.log 2>&1
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
              "${compose_args[@]}" logs --no-color backend \
              > diagnostics/docker/backend.log 2>&1
            cp .env.legacy diagnostics/docker/env.legacy.redacted
            sed -Ei 's/^((POSTGRES_PASSWORD|DATABASE_URL|SECRET_KEY)=).*/\1[REDACTED]/' \
              diagnostics/docker/env.legacy.redacted
          }
          cleanup() {
            exit_code=$?
            collect_diagnostics
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
              "${compose_args[@]}" down --volumes --remove-orphans || true
            rm -f .env.legacy
            exit "$exit_code"
          }
          trap cleanup EXIT

          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" up -d --wait --wait-timeout 180 backend
          postgres_id="$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" "${compose_args[@]}" ps -q postgres)"
          test -n "$postgres_id"
          postgres_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres_id")"
          test -n "$postgres_volume"
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" exec -T postgres sh -ceu '
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                --host 127.0.0.1 \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB" \
                --no-password \
                --set ON_ERROR_STOP=1 \
                --command "
                  CREATE TABLE IF NOT EXISTS aionex_legacy_upgrade_sentinel (
                    id integer PRIMARY KEY,
                    value text NOT NULL
                  );
                  INSERT INTO aionex_legacy_upgrade_sentinel (id, value)
                  VALUES (1, '\''preserved'\'')
                  ON CONFLICT (id) DO UPDATE SET value = EXCLUDED.value;
                "
            '

          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" down --remove-orphans
          sed -i \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=conflicting-password/' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://legacy_user:rotated-password@postgres:5432/legacy_database|' \
            .env.legacy

          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" up -d --build
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" up -d --wait --wait-timeout 180 backend backup-worker
          reconciler_id="$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" "${compose_args[@]}" ps --all -q postgres-credential-reconciler)"
          test -n "$reconciler_id"
          test "$(docker inspect --format '{{.State.ExitCode}}' "$reconciler_id")" = "0"
          COMPOSE_PROJECT_NAME=aionex-legacy-compat \
            COMPOSE_FILE=docker-compose.production.yml \
            ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            ./scripts/reconcile-postgres-credentials.sh
          upgraded_postgres_id="$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" "${compose_args[@]}" ps -q postgres)"
          test -n "$upgraded_postgres_id"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$upgraded_postgres_id")" = "$postgres_volume"
          test "$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" "${compose_args[@]}" run --rm --no-deps -e PGPASSWORD=rotated-password postgres-credential-reconciler psql --host postgres --username legacy_user --dbname legacy_database --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command 'SELECT value FROM aionex_legacy_upgrade_sentinel WHERE id = 1' | tr -d '[:space:]')" = "preserved"
          if AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.legacy" \
            "${compose_args[@]}" run --rm --no-deps -e PGPASSWORD=legacy-password postgres-credential-reconciler psql --host postgres --username legacy_user --dbname legacy_database --no-password --command "SELECT 1" >/dev/null 2>&1
          then
            echo "The superseded PostgreSQL password still authenticates." >&2
            exit 1
          fi
      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-docker-diagnostics
          path: web-dashboard/diagnostics/docker
          if-no-files-found: warn
          retention-days: 7
      - name: Verify bare Compose upgrade reads legacy .env
        working-directory: web-dashboard
        run: |
          cp .env.production.example .env
          sed -i \
            -e 's/^POSTGRES_USER=.*/POSTGRES_USER=bare_legacy_user/' \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=bare-legacy-password/' \
            -e 's/^POSTGRES_DB=.*/POSTGRES_DB=bare_legacy_database/' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=|' \
            .env
          bare_project=aionex-bare-legacy-compat
          cleanup() {
            exit_code=$?
            set +e
            if ((exit_code != 0)); then
              COMPOSE_PROJECT_NAME="$bare_project" \
                docker compose logs \
                  --no-color \
                  postgres-credential-reconciler
            fi
            COMPOSE_PROJECT_NAME="$bare_project" \
              docker compose down --volumes --remove-orphans
            rm -f .env
            exit "$exit_code"
          }
          trap cleanup EXIT

          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose up -d --build backend
          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose up -d --wait --wait-timeout 180 backend
          postgres_id="$(COMPOSE_PROJECT_NAME="$bare_project" docker compose ps -q postgres)"
          test -n "$postgres_id"
          postgres_volume="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$postgres_id")"
          test -n "$postgres_volume"
          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose exec -T postgres sh -ceu '
              PGPASSWORD="$POSTGRES_PASSWORD" psql \
                --host 127.0.0.1 \
                --username "$POSTGRES_USER" \
                --dbname "$POSTGRES_DB" \
                --no-password \
                --set ON_ERROR_STOP=1 \
                --command "
                  CREATE TABLE aionex_bare_upgrade_sentinel (
                    id integer PRIMARY KEY,
                    value text NOT NULL
                  );
                  INSERT INTO aionex_bare_upgrade_sentinel (id, value)
                  VALUES (1, '\''preserved'\'');
                "
            '

          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose down --remove-orphans
          sed -i \
            -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=bare-conflicting-password/' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=postgresql+asyncpg://bare_legacy_user:bare-rotated-password@postgres:5432/bare_legacy_database|' \
            .env

          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose up -d --build
          COMPOSE_PROJECT_NAME="$bare_project" \
            docker compose up -d --wait --wait-timeout 180 backend
          COMPOSE_PROJECT_NAME="$bare_project" \
            ./scripts/reconcile-postgres-credentials.sh
          upgraded_postgres_id="$(COMPOSE_PROJECT_NAME="$bare_project" docker compose ps -q postgres)"
          test -n "$upgraded_postgres_id"
          test "$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$upgraded_postgres_id")" = "$postgres_volume"
          test "$(COMPOSE_PROJECT_NAME="$bare_project" docker compose run --rm --no-deps -e PGPASSWORD=bare-rotated-password postgres-credential-reconciler psql --host postgres --username bare_legacy_user --dbname bare_legacy_database --no-password --tuples-only --no-align --set ON_ERROR_STOP=1 --command 'SELECT value FROM aionex_bare_upgrade_sentinel WHERE id = 1' | tr -d '[:space:]')" = "preserved"
      - name: Smoke production backup worker and restore round-trip
        working-directory: web-dashboard
        run: |
          compose_args=(
            docker compose
            --env-file .env.production
            -f docker-compose.production.yml
          )
          cleanup() {
            AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
              "${compose_args[@]}" down --remove-orphans
          }
          trap cleanup EXIT
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
            "${compose_args[@]}" up \
              -d \
              --wait \
              --wait-timeout 180 \
              backup-worker
          worker_id="$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" "${compose_args[@]}" ps -q backup-worker)"
          test -n "$worker_id"
          test "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$worker_id")" = "healthy"
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
            "${compose_args[@]}" exec -T backup-worker \
              sh -ceu \
              'pg_dump --version | grep -Eq "\(PostgreSQL\) 16(\.|$)"'
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
            "${compose_args[@]}" stop backup-worker
          test -z "$(AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" "${compose_args[@]}" ps --status running -q backup-worker)"
          AIOS_ENV_FILE="$GITHUB_WORKSPACE/web-dashboard/.env.production" \
            "${compose_args[@]}" run \
              --rm \
              --no-deps \
              -e RUN_LIVE_BACKUP_SMOKE=1 \
              backup-worker \
              python -m pytest -q \
              /workspace/web-dashboard/backend/tests/test_backup_executor.py::test_live_postgres_worker_backup_and_restore_smoke

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        working-directory: web-dashboard/backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: web-dashboard/frontend
        run: |
          npm ci
          npm audit --omit=dev
