name: Final Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aionex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-validation-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aionex_test
      REDIS_URL: redis://localhost:6379/0
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: web-dashboard/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run database migrations
        working-directory: web-dashboard/backend
        run: alembic upgrade head
      - name: Run backend verification
        working-directory: web-dashboard/backend
        run: |
          chmod +x scripts/verify_backend.sh
          ./scripts/verify_backend.sh
      - name: Run backend tests with coverage
        working-directory: web-dashboard/backend
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        working-directory: web-dashboard
        run: docker compose -f docker-compose.yml config
      - name: Build production images
        working-directory: web-dashboard
        run: docker compose -f docker-compose.yml build

  security:
    name: Dependency Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        working-directory: web-dashboard/backend
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit frontend dependencies
        working-directory: web-dashboard/frontend
        continue-on-error: true
        run: |
          npm install
          npm audit --audit-level=high
