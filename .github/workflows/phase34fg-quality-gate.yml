name: Phase 34F/34G Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase34fg-quality-gate.yml"
      - "tests/test_phase34*.py"
      - "web-dashboard/backend/app/api/owner/three_d.py"
      - "web-dashboard/backend/app/api/v1/endpoints/three_d_jobs.py"
      - "web-dashboard/backend/app/services/three_d_*.py"
      - "web-dashboard/backend/tests/test_phase34*.py"
      - "web-dashboard/backend/tests/test_owner_dashboard_integration.py"
      - "vip-frontend/**"
      - "web-dashboard/frontend/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/phase34fg-quality-gate.yml"
      - "tests/test_phase34*.py"
      - "web-dashboard/backend/app/api/owner/three_d.py"
      - "web-dashboard/backend/app/api/v1/endpoints/three_d_jobs.py"
      - "web-dashboard/backend/app/services/three_d_*.py"
      - "web-dashboard/backend/tests/test_phase34*.py"
      - "web-dashboard/backend/tests/test_owner_dashboard_integration.py"
      - "vip-frontend/**"
      - "web-dashboard/frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase34fg-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-resilience-tests:
    name: Policy, resilience and backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aionex_phase34fg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: phase34fg-ci-test-only-placeholder-key-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/aionex_phase34fg_ci
      REDIS_URL: redis://localhost:6379/0
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            web-dashboard/backend/requirements.txt
            web-dashboard/backend/requirements-runtime.txt
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r web-dashboard/backend/requirements.txt
      - name: Prepare isolated CI database
        working-directory: web-dashboard/backend
        run: alembic upgrade head
      - name: Run Phase 34 source and integration contracts
        run: python -m pytest -q --maxfail=1 tests/test_phase34*.py
      - name: Run affected backend policy and resilience tests
        working-directory: web-dashboard/backend
        run: |
          python -m pytest -q --maxfail=1 \
            tests/test_phase34*.py \
            tests/test_owner_dashboard_integration.py

  vip-frontend:
    name: VIP frontend type, lint and static build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vip-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vip-frontend/package-lock.json
      - run: npm ci
      - name: Check source and locale integrity
        run: npm run check:integrity
      - name: Check TypeScript
        run: npm run type-check
      - name: Lint VIP frontend
        run: npm run lint
      - name: Build static VIP frontend
        run: npm run build:static
      - name: Smoke static export
        run: npm run smoke:static

  owner-frontend:
    name: Owner frontend type, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-dashboard/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json
      - run: npm ci
      - name: Check Owner Arabic coverage
        run: npm run check:owner-arabic
      - name: Check TypeScript
        run: npm run type-check
      - name: Lint Owner frontend
        run: npm run lint
      - name: Build Owner frontend
        run: npm run build
