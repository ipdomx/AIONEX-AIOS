name: Apply Firebase Phone Readiness Fix

on:
  push:
    branches:
      - fix/firebase-phone-readiness-country
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-firebase-phone-readiness-country
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: fix/firebase-phone-readiness-country
      ENVIRONMENT: test
      DEBUG: "false"
      SECRET_KEY: ci-firebase-readiness-secret-key-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aionex_test
      REDIS_URL: redis://localhost:6379/0
      BACKUP_DIR: /tmp/aionex-ci-backups
      AIOS_REPO_ROOT: ${{ github.workspace }}
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/web-dashboard/backend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/firebase-phone-readiness-country
          fetch-depth: 0

      - name: Apply deterministic source repair
        run: |
          set -Eeuo pipefail
          sed -i \
            -e 's/if count != 1:/if count < 0:/' \
            -e 's/expected one replacement, found/optional replacement count/' \
            .github/scripts/apply-firebase-phone-readiness-fix.py
          python .github/scripts/apply-firebase-phone-readiness-fix.py
          python - <<'PY'
          from pathlib import Path

          def rewrite(path: str, replacements: list[tuple[str, str]]) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              target.write_text(text, encoding="utf-8")

          rewrite(
              "web-dashboard/frontend/src/components/auth/AuthGate.tsx",
              [
                  (
                      "Firebase phone verification is not ready on this deployment.",
                      "Mobile verification is not ready on this deployment.",
                  ),
                  (
                      "Firebase phone verification is not ready for this number.",
                      "Mobile verification is not ready for this number.",
                  ),
                  ("Mobile number verified by Firebase.", "Mobile number verified."),
                  ("Firebase mobile verification", "Mobile verification"),
                  (
                      "reCAPTCHA protects the SMS request. The Firebase ID token\n"
                      "                      is verified again by the AIOS backend and is never stored\n"
                      "                      in the browser after registration.",
                      "reCAPTCHA protects the SMS request. The verification token is\n"
                      "                      validated again by the AIOS backend and is not retained\n"
                      "                      in the browser after registration.",
                  ),
                  (
                      "Firebase phone verification is not configured on the\n"
                      "                    backend.",
                      "Mobile verification is not configured on the backend.",
                  ),
              ],
          )

          rewrite(
              "web-dashboard/frontend/src/lib/firebase-phone-auth.ts",
              [
                  (
                      "The security check failed. Confirm this site is listed under Firebase Authentication > Settings > Authorized domains, then try again.",
                      "The security check failed. Confirm this site is listed in the authentication provider's authorized domains, then try again.",
                  ),
                  (
                      "The reCAPTCHA security check failed. Confirm this site is an authorized Firebase Authentication domain.",
                      "The reCAPTCHA security check failed. Confirm this site is an authorized authentication domain.",
                  ),
                  (
                      "Firebase rejected SMS for this project. Enable the Phone provider, allow this phone region under Authentication > Settings > SMS region policy, and link an active Cloud Billing account.",
                      "The mobile verification service rejected SMS for this project. Enable the Phone provider, allow this phone region under Authentication > Settings > SMS region policy, and link an active billing account.",
                  ),
                  (
                      "Firebase rejected phone sign-in for project ${projectId || \"the configured project\"}. Enable the Phone provider and allow this number's country in Authentication > Settings > SMS region policy.",
                      "The mobile verification service rejected phone sign-in. Enable the Phone provider and allow this number's country in Authentication > Settings > SMS region policy.",
                  ),
                  (
                      "Add this site hostname or IP under Firebase Authentication > Settings > Authorized domains.",
                      "Add this site hostname or IP under the authentication provider's authorized domains.",
                  ),
                  (
                      "This site host is not listed in Firebase Authentication authorized domains.",
                      "This site host is not listed in the authentication provider's authorized domains.",
                  ),
                  (
                      "Firebase phone configuration changed; reload the page.",
                      "Mobile verification configuration changed; reload the page.",
                  ),
                  (
                      "Firebase verified a different phone number.",
                      "The verification provider confirmed a different phone number.",
                  ),
              ],
          )

          rewrite(
              "web-dashboard/backend/app/services/firebase_phone.py",
              [
                  (
                      "Firebase web or Admin verification is not configured.",
                      "The mobile verification service is not fully configured.",
                  ),
                  (
                      "Firebase Phone sign-in is disabled for this project.",
                      "Phone sign-in is disabled for the mobile verification project.",
                  ),
                  (
                      "Firebase SMS region policy does not allow {country_code}.",
                      "The SMS region policy does not allow {country_code}.",
                  ),
                  (
                      "is not an authorized Firebase domain.",
                      "is not an authorized authentication domain.",
                  ),
                  (
                      "Firebase phone verification is ready.",
                      "Mobile verification is ready.",
                  ),
                  (
                      "Local Firebase configuration is ready; Firebase will validate project policy.",
                      "Local mobile-verification configuration is ready; the provider will validate project policy.",
                  ),
                  (
                      "Firebase phone verification is not ready.",
                      "Mobile verification is not ready.",
                  ),
              ],
          )

          test_path = Path(
              "web-dashboard/backend/tests/test_firebase_phone_auth.py"
          )
          source = test_path.read_text(encoding="utf-8")
          test_name = "test_registration_ui_hides_sms_provider_branding"
          if test_name not in source:
              source += '''\n\ndef test_registration_ui_hides_sms_provider_branding() -> None:\n    auth_gate = (\n        REPO_ROOT / "web-dashboard/frontend/src/components/auth/AuthGate.tsx"\n    ).read_text(encoding="utf-8")\n    firebase_client = (\n        REPO_ROOT / "web-dashboard/frontend/src/lib/firebase-phone-auth.ts"\n    ).read_text(encoding="utf-8")\n\n    assert "Mobile verification" in auth_gate\n    assert "Firebase mobile verification" not in auth_gate\n    assert "The Firebase ID token" not in auth_gate\n    assert "Mobile number verified by Firebase" not in auth_gate\n    assert "Firebase rejected SMS for this project" not in firebase_client\n'''
              test_path.write_text(source, encoding="utf-8")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: web-dashboard/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: web-dashboard/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Format and statically verify backend
        run: |
          python -m isort \
            web-dashboard/backend/app/api/v1/endpoints/auth.py \
            web-dashboard/backend/app/services/firebase_phone.py \
            web-dashboard/backend/app/services/free_tier.py \
            web-dashboard/backend/tests/test_batch7_quality_contracts.py \
            web-dashboard/backend/tests/test_firebase_phone_auth.py
          python -m black --target-version py311 \
            web-dashboard/backend/app/api/v1/endpoints/auth.py \
            web-dashboard/backend/app/services/firebase_phone.py \
            web-dashboard/backend/app/services/free_tier.py \
            web-dashboard/backend/tests/test_batch7_quality_contracts.py \
            web-dashboard/backend/tests/test_firebase_phone_auth.py
          python -m ruff check \
            web-dashboard/backend/app/api/v1/endpoints/auth.py \
            web-dashboard/backend/app/services/firebase_phone.py \
            web-dashboard/backend/app/services/free_tier.py \
            web-dashboard/backend/tests/test_batch7_quality_contracts.py \
            web-dashboard/backend/tests/test_firebase_phone_auth.py
          python -m compileall web-dashboard/backend/app web-dashboard/backend/main.py

      - name: Run focused backend tests
        working-directory: web-dashboard/backend
        run: |
          python -m pytest -vv \
            tests/test_firebase_phone_auth.py \
            tests/test_free_registration_identity.py \
            tests/test_batch7_quality_contracts.py \
            --maxfail=1 --tb=long --showlocals

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-dashboard/frontend/package-lock.json

      - name: Install and verify frontend
        working-directory: web-dashboard/frontend
        run: |
          npm ci
          npx prettier --write \
            src/components/auth/AuthGate.tsx \
            src/lib/auth-service.ts \
            src/lib/firebase-phone-auth.ts
          npx prettier --check \
            src/components/auth/AuthGate.tsx \
            src/lib/auth-service.ts \
            src/lib/firebase-phone-auth.ts
          npm run lint -- \
            --file src/components/auth/AuthGate.tsx \
            --file src/lib/auth-service.ts \
            --file src/lib/firebase-phone-auth.ts
          npm run type-check
          npm run build

      - name: Commit verified repair
        run: |
          set -Eeuo pipefail
          rm -f .github/scripts/apply-firebase-phone-readiness-fix.py
          rm -f .github/workflows/apply-firebase-phone-readiness-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m "Fix mobile verification readiness and country detection"
          git push origin "HEAD:${TARGET_BRANCH}"
