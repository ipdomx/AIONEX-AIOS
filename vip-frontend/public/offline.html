<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#03050a">
  <title>AIONEX AIOS — Offline</title>
  <style>
    :root{color-scheme:dark;background:#03050a;color:#eafcff;font-family:system-ui,-apple-system,sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#10253f,#03050a 55%)}
    main{max-width:34rem;margin:2rem;padding:2rem;border:1px solid #ffffff16;border-radius:1.5rem;background:#07101dcc;box-shadow:0 1rem 4rem #0008;text-align:center}
    img{width:5rem;height:5rem}h1{font-size:1.5rem;margin:1rem 0}.en{direction:ltr;color:#a9b9c9;font-size:.9rem;line-height:1.7}
    button{border:0;border-radius:.8rem;padding:.8rem 1.2rem;background:#42d9f5;color:#031019;font-weight:700;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="/icons/aionex-192.png" alt="AIONEX">
  <h1>الاتصال غير متاح حاليًا</h1>
  <p>يمكنك فتح الصفحات المحفوظة، وسنعاود الاتصال بخدمات AIOS عند عودة الشبكة.</p>
  <p class="en">You are offline. Cached pages remain available, and AIOS will reconnect when the network returns.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة</button>
</main></body></html>
