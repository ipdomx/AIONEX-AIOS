services:
  project-worker:
    environment:
      PROJECT_EXECUTION_WORKER_CAPACITY: "${PROJECT_EXECUTION_WORKER_CAPACITY:-2}"
      PROJECT_EXECUTION_MAX_ATTEMPTS: "${PROJECT_EXECUTION_MAX_ATTEMPTS:-3}"
      PROJECT_EXECUTION_RETRY_BASE_SECONDS: "${PROJECT_EXECUTION_RETRY_BASE_SECONDS:-5}"
      PROJECT_EXECUTION_TENANT_ACTIVE_LIMIT: "${PROJECT_EXECUTION_TENANT_ACTIVE_LIMIT:-2}"
      PROJECT_EXECUTION_RESOURCE_CLASSES: "${PROJECT_EXECUTION_RESOURCE_CLASSES:-project-build-cpu}"
      PROJECT_EXECUTION_WORKER_STALE_SECONDS: "${PROJECT_EXECUTION_WORKER_STALE_SECONDS:-90}"
    deploy:
      replicas: 3
