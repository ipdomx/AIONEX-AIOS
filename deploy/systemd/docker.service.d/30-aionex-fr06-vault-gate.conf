[Service]
# Fail closed on every Docker daemon start. No key material is read here: the
# operator must first restore the external key bundle to tmpfs and unlock/mount
# both vaults through the guarded FR-06B4 recovery procedure.
ExecStartPre=/usr/bin/python3 /opt/AIOS/scripts/security/fr06b4_vault_provision.py status --require-host-ready
