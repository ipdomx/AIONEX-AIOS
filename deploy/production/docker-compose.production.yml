services:
  backend:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      DATABASE_POOLING_ENABLED: "true"
      DATABASE_POOL_SIZE: "12"
      DATABASE_MAX_OVERFLOW: "2"
      DATABASE_POOL_TIMEOUT_SECONDS: "5"
      DATABASE_POOL_CONNECTION_BUDGET: "60"
      REDIS_POOL_SIZE: "18"
      PROJECT_EXECUTION_ADMISSION_CONCURRENCY: "14"
      PROJECT_EXECUTION_ADMISSION_GLOBAL_LIMIT: "48"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AIOS_API_ORIGIN: ${API_ORIGIN}
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/RUNPOD_GPU.env
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/operator-secrets/telegram-bot-token
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.0"
    pids_limit: 768
    expose:
      - "8000"
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets:/run/secrets/aionex:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/operator-secrets/telegram-bot-token:ro
      - backup_data:/var/lib/aionex/backups:ro
      - portal_asset_data:/var/lib/aionex/portal-assets:rw
      - project_execution_data:/var/lib/aionex/project-executions:rw
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
      - mobile_release_data:/var/lib/aionex/mobile-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    restart: "no"
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  backup-worker:
    image: aionex-aios-backend:local
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.backup_worker"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    volumes:
      - ../..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

