services:
  backend:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AIOS_API_ORIGIN: ${API_ORIGIN}
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/runpod-gpu.env
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets:/run/secrets/aionex:ro
      - ../../web-dashboard/secrets/RUNPOD_GPU.env:/run/secrets/aionex/runpod-gpu.env:ro
      - backup_data:/var/lib/aionex/backups:ro
      - portal_asset_data:/var/lib/aionex/portal-assets:rw
      - project_execution_data:/var/lib/aionex/project-executions:rw
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
      - mobile_release_data:/var/lib/aionex/mobile-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    restart: "no"
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  backup-worker:
    image: aionex-aios-backend:local
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.backup_worker"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  communication-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.communication_worker"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets:/run/secrets/aionex:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.communication_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  operations-observer:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.operations_observer"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.operations_observer", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  studio-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      STUDIO_ASSET_ROOT: /var/lib/aionex/studio-assets
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.studio_worker"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.studio_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  three-d-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/runpod-gpu.env
    command: ["python", "-m", "app.services.three_d_worker"]
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets/RUNPOD_GPU.env:/run/secrets/aionex/runpod-gpu.env:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.three_d_worker", "--healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  project-worker:
    profiles: ["ai-execution"]
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      PROJECT_EXECUTION_SECRET_FILE: /run/secrets/aionex/project-openai.env
      PROJECT_EXECUTION_OUTPUT_ROOT: /var/lib/aionex/project-executions
      PROJECT_EXECUTION_LOCAL_REFERENCE: /run/references/phase22b/local-qwen3-8b
      PROJECT_EXECUTION_BUDGET_CAP_USD: "0.05"
      PROJECT_EXECUTION_WEB_SEARCH_COST_USD: "0.01"
      PROJECT_EXECUTION_RESEARCH_MODEL: "gpt-5.4-nano"
    command: ["python", "-m", "app.services.project_execution_worker"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_PROJECT_EXECUTION_SECRET_HOST_FILE:-/root/.config/aionex/phase22c-openai.env}:/run/secrets/aionex/project-openai.env:ro
      - ${AIOS_PHASE22B_REFERENCE_HOST_DIR:-/var/tmp/aionex-phase22b/sandbox-output/local-qwen3-8b}:/run/references/phase22b/local-qwen3-8b:ro
      - project_execution_data:/var/lib/aionex/project-executions
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.project_execution_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../vip-frontend
    environment:
      NODE_ENV: production
      AIOS_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy


  telegram-worker:
    profiles: ["telegram"]
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
    command: ["python", "-m", "app.services.telegram_worker"]
    restart: unless-stopped
    stop_grace_period: 45s
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/secrets/aionex/telegram-bot-token:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.telegram_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --quiet",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:
  project_execution_data:
  studio_asset_data:
  mobile_release_data:
  portal_asset_data:
  caddy_data:
  caddy_config:
