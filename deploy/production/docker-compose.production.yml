services:
  backend:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AIOS_API_ORIGIN: ${API_ORIGIN}
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/RUNPOD_GPU.env
    restart: unless-stopped
    mem_limit: 4g
    cpus: "4.0"
    pids_limit: 768
    expose:
      - "8000"
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets:/run/secrets/aionex:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/secrets/aionex/telegram-bot-token:ro
      - backup_data:/var/lib/aionex/backups:ro
      - portal_asset_data:/var/lib/aionex/portal-assets:rw
      - project_execution_data:/var/lib/aionex/project-executions:rw
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
      - mobile_release_data:/var/lib/aionex/mobile-releases:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    restart: "no"
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  backup-worker:
    image: aionex-aios-backend:local
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.backup_worker"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    volumes:
      - ../..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  communication-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      FIREBASE_ADMIN_CREDENTIALS_JSON: /run/secrets/aionex/firebase-admin.json
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.communication_worker"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 384
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets:/run/secrets/aionex:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/secrets/aionex/telegram-bot-token:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.communication_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  operations-observer:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.operations_observer"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    volumes:
      - ../..:/workspace:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.operations_observer", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  studio-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      STUDIO_ASSET_ROOT: /var/lib/aionex/studio-assets
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.studio_worker"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    volumes:
      - ../..:/workspace:ro
      - studio_asset_data:/var/lib/aionex/studio-assets:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.studio_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  three-d-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      THREE_D_RUNPOD_SECRET_FILE: /run/secrets/aionex/runpod-gpu.env
    command: ["python", "-m", "app.services.three_d_worker"]
    restart: unless-stopped
    mem_limit: 3g
    cpus: "2.0"
    pids_limit: 512
    stop_grace_period: 45s
    volumes:
      - ../..:/workspace:ro
      - ../../web-dashboard/secrets/RUNPOD_GPU.env:/run/secrets/aionex/runpod-gpu.env:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "su-exec", "aionex", "python", "-m", "app.services.three_d_worker", "--healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s

  project-worker:
    profiles: ["ai-execution"]
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      PROJECT_EXECUTION_SECRET_FILE: /run/secrets/aionex/project-openai.env
      PROJECT_EXECUTION_OUTPUT_ROOT: /var/lib/aionex/project-executions
      PROJECT_EXECUTION_LOCAL_REFERENCE: /run/references/phase22b/local-qwen3-8b
      PROJECT_EXECUTION_BUDGET_CAP_USD: "0.05"
      PROJECT_EXECUTION_WEB_SEARCH_COST_USD: "0.01"
      PROJECT_EXECUTION_RESEARCH_MODEL: "gpt-5.4-nano"
    command: ["python", "-m", "app.services.project_execution_worker"]
    restart: unless-stopped
    mem_limit: 4g
    cpus: "3.0"
    pids_limit: 768
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_PROJECT_EXECUTION_SECRET_HOST_FILE:-/root/.config/aionex/phase22c-openai.env}:/run/secrets/aionex/project-openai.env:ro
      - ${AIOS_PHASE22B_REFERENCE_HOST_DIR:-/var/tmp/aionex-phase22b/sandbox-output/local-qwen3-8b}:/run/references/phase22b/local-qwen3-8b:ro
      - project_execution_data:/var/lib/aionex/project-executions
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.project_execution_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../vip-frontend
    environment:
      NODE_ENV: production
      AIOS_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 256
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy


  telegram-worker:
    profiles: ["telegram"]
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/aionex/telegram-bot-token
    command: ["python", "-m", "app.services.telegram_worker"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 45s
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/secrets/aionex/telegram-bot-token:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.telegram_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  security-scan-worker:
    image: aionex-aios-security-tools:local
    build:
      context: ../../web-dashboard/backend
      dockerfile: Dockerfile.security-tools
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURITY_SCAN_WORKER_POLL_SECONDS: "5"
      SECURITY_SCAN_JOB_LEASE_SECONDS: "1800"
      SECURITY_SCAN_WORKER_HEALTH_FILE: /tmp/aionex-security-scan-worker.json
      SECURITY_ZAP_URL: ${SECURITY_ZAP_URL:-}
      SECURITY_ZAP_API_KEY: ${SECURITY_ZAP_API_KEY:-}
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.security_scan_worker"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 384
    read_only: true
    volumes:
      - ../..:/workspace:ro
      - security_source_data:/var/lib/aionex/security-sources:ro
      - project_execution_data:/var/lib/aionex/project-executions:ro
      - security_tool_cache_data:/tmp/aionex-security-home:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.security_scan_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  security-remediation-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURITY_REMEDIATION_WORKER_POLL_SECONDS: "5"
      SECURITY_REMEDIATION_WORKER_HEALTH_FILE: /tmp/aionex-security-remediation-worker.json
      SECURITY_REMEDIATION_ROOT: /var/lib/aionex/security-remediations
      PORTAL_ASSET_ROOT: ""
      STUDIO_ASSET_ROOT: ""
      MOBILE_RELEASE_ROOT: ""
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.security_remediation_worker"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 384
    volumes:
      - ../..:/workspace:ro
      - security_source_data:/var/lib/aionex/security-sources:ro
      - project_execution_data:/var/lib/aionex/project-executions:ro
      - security_remediation_data:/var/lib/aionex/security-remediations:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "su-exec", "aionex", "python", "-m", "app.services.security_remediation_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "SETGID", "SETUID"]

  security-zap:
    profiles: ["security-tools"]
    image: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 384
    read_only: true
    environment:
      SECURITY_ZAP_API_KEY: ${SECURITY_ZAP_API_KEY:-}
    command:
      - sh
      - -ceu
      - |
        test -n "$$SECURITY_ZAP_API_KEY"
        exec zap.sh -daemon -host 0.0.0.0 -port 8080 -config "api.key=$$SECURITY_ZAP_API_KEY" -config 'api.addrs.addr.name=.*' -config api.addrs.addr.regex=true -config connection.timeoutInSecs=10
    expose: ["8080"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/zap/.ZAP:rw,nosuid,uid=1000,gid=1000,mode=0700,size=256m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import os,urllib.parse,urllib.request; key=urllib.parse.quote(os.environ['SECURITY_ZAP_API_KEY']); urllib.request.urlopen('http://127.0.0.1:8080/JSON/core/view/version/?apikey='+key, timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 768
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --quiet",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:
  project_execution_data:
  studio_asset_data:
  mobile_release_data:
  portal_asset_data:
  security_source_data:
  security_remediation_data:
  security_tool_cache_data:
  caddy_data:
  caddy_config:
