      PROJECT_AI_MODEL_REFRESH_ENABLED: "false"
      PROJECT_EXECUTION_NPM_CACHE: /var/lib/aionex/project-npm-cache
    command: ["python", "-m", "app.services.project_execution_worker"]
    restart: unless-stopped
    mem_limit: 4g
    cpus: "3.0"
    pids_limit: 768
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_PROJECT_EXECUTION_SECRET_HOST_FILE:-/root/.config/aionex/phase22c-openai.env}:/run/secrets/aionex/project-openai.env:ro
      - ${AIOS_PHASE22B_REFERENCE_HOST_DIR:-/var/tmp/aionex-phase22b/sandbox-output/local-qwen3-8b}:/run/references/phase22b/local-qwen3-8b:ro
      - project_execution_data:/var/lib/aionex/project-executions
      - project_npm_cache_data:/var/lib/aionex/project-npm-cache
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.project_execution_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../vip-frontend
    environment:
      NODE_ENV: production
      AIOS_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.5"
    pids_limit: 256
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy


  telegram-worker:
    profiles: ["telegram"]
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
      AIOS_TELEGRAM_BOT_TOKEN_FILE: /run/operator-secrets/telegram-bot-token
    command: ["python", "-m", "app.services.telegram_worker"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    stop_grace_period: 45s
    volumes:
      - ../..:/workspace:ro
      - ${AIOS_TELEGRAM_BOT_TOKEN_HOST_FILE:-/root/.config/aionex/telegram/bot-token}:/run/operator-secrets/telegram-bot-token:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.telegram_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s

  security-tool-cache-init:
    image: aionex-aios-security-tools:local
    user: "0:0"
    command: ["sh", "-ceu", "mkdir -p /tmp/aionex-security-home/tmp && chown -R 1000:1000 /tmp/aionex-security-home"]
    read_only: true
    restart: "no"
    volumes:
      - security_tool_cache_data:/tmp/aionex-security-home:rw
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE"]
    network_mode: "none"

  security-scan-worker:
    image: aionex-aios-security-tools:local
    build:
      context: ../../web-dashboard/backend
      dockerfile: Dockerfile.security-tools
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURITY_SCAN_WORKER_POLL_SECONDS: "5"
      SECURITY_SCAN_JOB_LEASE_SECONDS: "1800"
      SECURITY_SCAN_WORKER_HEALTH_FILE: /tmp/aionex-security-scan-worker.json
      SECURITY_ZAP_URL: ${SECURITY_ZAP_URL:-http://security-zap:8080}
      SECURITY_ZAP_API_KEY: ${SECURITY_ZAP_API_KEY:-}
      TMPDIR: /tmp/aionex-security-home/tmp
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.security_scan_worker"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 384
    read_only: true
    volumes:
      - ../..:/workspace:ro
      - security_source_data:/var/lib/aionex/security-sources:ro
      - project_execution_data:/var/lib/aionex/project-executions:ro
      - security_tool_cache_data:/tmp/aionex-security-home:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      backend:
        condition: service_healthy
      security-tool-cache-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.security_scan_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  security-remediation-worker:
    image: aionex-aios-backend:local
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      SECURITY_REMEDIATION_WORKER_POLL_SECONDS: "5"
      SECURITY_REMEDIATION_WORKER_HEALTH_FILE: /tmp/aionex-security-remediation-worker.json
      SECURITY_REMEDIATION_ROOT: /var/lib/aionex/security-remediations
      PORTAL_ASSET_ROOT: ""
      STUDIO_ASSET_ROOT: ""
      MOBILE_RELEASE_ROOT: ""
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.security_remediation_worker"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 384
    volumes:
      - ../..:/workspace:ro
      - security_source_data:/var/lib/aionex/security-sources:ro
      - project_execution_data:/var/lib/aionex/project-executions:ro
      - security_remediation_data:/var/lib/aionex/security-remediations:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "su-exec", "aionex", "python", "-m", "app.services.security_remediation_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER", "SETGID", "SETUID"]

  security-zap:
    profiles: ["security-tools"]
    image: zaproxy/zap-stable:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
    restart: unless-stopped
    mem_limit: 3g
    cpus: "1.5"
    pids_limit: 384
    read_only: true
    environment:
      SECURITY_ZAP_API_KEY: ${SECURITY_ZAP_API_KEY:-}
    command:
      - sh
      - -ceu
      - |
        test -n "$$SECURITY_ZAP_API_KEY"
        printf '%s\n' '-Xmx1024m' > /home/zap/.ZAP/.ZAP_JVM.properties
        exec zap.sh -daemon -host 0.0.0.0 -port 8080 -config "api.key=$$SECURITY_ZAP_API_KEY" -config 'api.addrs.addr.name=.*' -config api.addrs.addr.regex=true -config connection.timeoutInSecs=10 -silent -notel
    expose: ["8080"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/zap/.ZAP:rw,nosuid,uid=1000,gid=1000,mode=0700,size=1g
      - /home/zap/.java:rw,nosuid,uid=1000,gid=1000,mode=0700,size=16m
      - /home/zap/.mozilla:rw,nosuid,uid=1000,gid=1000,mode=0700,size=128m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import os,urllib.parse,urllib.request; key=urllib.parse.quote(os.environ['SECURITY_ZAP_API_KEY']); urllib.request.urlopen('http://127.0.0.1:8080/JSON/core/view/version/?apikey='+key, timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  postgres:
    image: aionex-aios-postgres:16-hardened
    build:
      context: ../../web-dashboard/docker
      dockerfile: postgres.Dockerfile
    user: "70:70"
    restart: unless-stopped
    mem_limit: 8g
    cpus: "4.0"
    pids_limit: 768
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready --host 127.0.0.1 --port 5432 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" --quiet',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    profiles: ["local-ai"]
    restart: unless-stopped
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-8g}
    cpus: "${OLLAMA_CPUS:-4.0}"
    pids_limit: 512
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: "5m"
    volumes:
      - ollama_model_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  ollama-model-bootstrap:
    image: ollama/ollama@sha256:1685741456770df6e3cceb2a945a5f75e020f658d1701509668d6f4688f1dd3f
    profiles: ["local-ai"]
    restart: "no"
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    command: ["pull", "gemma3:4b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:
  project_execution_data:
  project_npm_cache_data:
  studio_asset_data:
  media_asset_data:
  mobile_release_data:
  portal_asset_data:
  security_source_data:
  security_remediation_data:
  security_tool_cache_data:
  ollama_model_data:
  caddy_data:
  caddy_config:
