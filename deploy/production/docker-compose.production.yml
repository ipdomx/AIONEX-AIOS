services:
  backend:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      AIOS_API_ORIGIN: ${API_ORIGIN}
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ../..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-credential-reconciler:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres-credential-reconciler:
    image: aionex-aios-backend:local
    build:
      context: ../../web-dashboard/backend
    restart: "no"
    command: ["python", "/app/app/db/postgres_credentials.py"]
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SOCKET_DIR: /var/run/postgresql
    volumes:
      - postgres_socket:/var/run/postgresql
    depends_on:
      postgres:
        condition: service_healthy

  backup-worker:
    image: aionex-aios-backend:local
    stop_grace_period: ${BACKUP_JOB_LEASE_SECONDS:-3600}s
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      BACKUP_DIR: /var/lib/aionex/backups
      AIOS_REPO_ROOT: /workspace
      PYTHONPATH: /workspace/src:/app
    command: ["python", "-m", "app.services.backup_worker"]
    restart: unless-stopped
    volumes:
      - ../..:/workspace:ro
      - backup_data:/var/lib/aionex/backups:rw
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.services.backup_worker", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../../web-dashboard/frontend
    environment:
      NODE_ENV: production
      AIOS_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --host 127.0.0.1 --port 5432 --quiet",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  postgres_socket:
  redis_data:
  backup_data:
  caddy_data:
  caddy_config:
