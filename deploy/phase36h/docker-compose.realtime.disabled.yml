# Phase 36H.3 source-only candidate profile.
# This file is NOT included by the production Compose stack.
# Enabling the profile still does not expose host ports and only runs help/preflight commands.
services:
  realtime-sfu-candidate:
    image: livekit/livekit-server@sha256:d0d1cfdbe95617647bbe91630454526c2cdd88cec83f41114b3495b444918b9a
    profiles: ["phase36h-realtime-source-only"]
    restart: "no"
    command: ["--help"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [realtime-source-only]

  realtime-turn-candidate:
    image: coturn/coturn@sha256:75e9ebd1e19005bec0c7f591d29afe22f959916ac8d9c852452f27db8c789828
    profiles: ["phase36h-realtime-source-only"]
    restart: "no"
    command: ["--help"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: ["ALL"]
    # Coturn 4.17.2 ships turnserver with cap_net_bind_service. Docker must keep
    # that capability in the bounding set or execve fails with EPERM even for
    # the source-only --help preflight. No other Linux capability is retained.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt: ["no-new-privileges:true"]
    networks: [realtime-source-only]

networks:
  realtime-source-only:
    internal: true
