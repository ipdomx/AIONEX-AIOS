apiVersion: apps/v1
kind: Deployment
metadata:
  name: aionex-realtime-sfu-candidate
  labels:
    app.kubernetes.io/name: aionex-realtime-sfu-candidate
    app.kubernetes.io/part-of: aionex-aios
    aionex.io/phase: "36h"
    aionex.io/activation: "disabled"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aionex-realtime-sfu-candidate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aionex-realtime-sfu-candidate
        app.kubernetes.io/part-of: aionex-aios
        aionex.io/realtime-candidate: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server@sha256:d0d1cfdbe95617647bbe91630454526c2cdd88cec83f41114b3495b444918b9a
          args: ["--help"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aionex-realtime-turn-candidate
  labels:
    app.kubernetes.io/name: aionex-realtime-turn-candidate
    app.kubernetes.io/part-of: aionex-aios
    aionex.io/phase: "36h"
    aionex.io/activation: "disabled"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aionex-realtime-turn-candidate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aionex-realtime-turn-candidate
        app.kubernetes.io/part-of: aionex-aios
        aionex.io/realtime-candidate: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: coturn/coturn@sha256:75e9ebd1e19005bec0c7f591d29afe22f959916ac8d9c852452f27db8c789828
          args: ["--help"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aionex-realtime-candidate-default-deny
spec:
  podSelector:
    matchLabels:
      aionex.io/realtime-candidate: "true"
  policyTypes: ["Ingress", "Egress"]
